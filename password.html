<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mot de passe 🔒</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

<div class="letter">

<h1>🔒 Mot de passe</h1>

<p>
Entre le mot secret pour continuer ❤️
</p>


<div style="font-size:80px;">
🌸
</div>


<input 
id="password"
type="password"
placeholder="Mot de passe"
style="
padding:15px;
border-radius:20px;
border:2px solid #d9a92e;
font-size:18px;
text-align:center;
">


<br>


<button onclick="verifier()">
Déverrouiller 🔐
</button>


<p id="message"></p>


</div>

</div>


<script>

function verifier(){

let mot = document.getElementById("password").value;


if(mot === "2008"){

window.location.href="welcome.html";

}

else{

document.getElementById("message").innerHTML =
"Ce n'est pas le bon mot de passe ❤️";

}

}

</script>


</body>

</html>
