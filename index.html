<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Mom ❤️</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(to bottom,#ffe6f0,#fff5f8);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:25px;
            width:80%;
            max-width:600px;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }

        h1{
            color:#e91e63;
        }

        p{
            font-size:20px;
            line-height:1.7;
            color:#555;
        }

        button{
            margin-top:20px;
            padding:15px 30px;
            border:none;
            border-radius:50px;
            background:#e91e63;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#d81b60;
        }
    </style>
</head>

<body>

<div class="card">
<h1>❤️ I Love You, Mom ❤️</h1>

<p>
Thank you for everything you do for me.
I may not say it enough, but I appreciate your love,
your strength, and your kindness every single day.
You will always have a special place in my heart.
</p>

<button onclick="alert('I love you so much, Mom! ❤️')">
Click Here ❤️
</button>

</div>

</body>
</html>
