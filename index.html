<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pour ma maman ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

<h1>💌 Un message pour toi</h1>

<div class="teddy">
🧸❤️
</div>

<p>
Un courrier spécial pour toi, Maman 💜
</p>


<div class="envelope" id="envelope">

<div class="flap"></div>

<div class="seal">
❤️
</div>

<div class="inside-letter">
💌
</div>

</div>


<button onclick="ouvrirMail()">
Ouvrir la lettre 💌
</button>


<div id="next" style="display:none;">

<p>
La surprise est prête ✨
</p>

<button onclick="suivant()">
Suivant ➜
</button>

</div>


</div>



<script>

function ouvrirMail(){

document.getElementById("envelope")
.classList.add("open");


document.querySelector(".inside-letter")
.style.display="block";


setTimeout(function(){

document.getElementById("next")
.style.display="block";

},1500);


}



function suivant(){

window.location.href="password.html";

}


</script>


</body>

</html>
